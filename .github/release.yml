changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security and safety
      labels:
        - security
        - safety
    - title: Product and UX
      labels:
        - feature
        - enhancement
        - ux
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
