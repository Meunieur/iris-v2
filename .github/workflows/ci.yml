name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows verification
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit and contract tests
        run: npm test

      - name: Run disposable HTTP integration tests
        run: npm run test:integration

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Enforce the public snapshot technical policy
        run: npm run release:public-preflight:technical

      - name: Build production bundles
        run: npm run build

      - name: Enforce the full dependency audit policy
        run: npm run audit:policy

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
