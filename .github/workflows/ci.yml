name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows verification
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit and contract tests
        run: npm test

      - name: Run disposable HTTP integration tests
        run: npm run test:integration

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Enforce the public snapshot technical policy
        run: npm run release:public-preflight:technical

      - name: Build production bundles
        run: npm run build

      - name: Enforce the full dependency audit policy
        run: npm run audit:policy

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
